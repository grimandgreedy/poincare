[workspace]
members = [
    "crates/poincare-lib",
    "crates/poincare-app",
    "crates/poincare-dvd",
    "crates/poincare-mobile",
]
resolver = "3"

[workspace.dependencies]
poincare-lib = { path = "crates/poincare-lib", version = "0.7.0" }
viewport-lib = { version = "0.17.0" }
wgpu = { version = "27.0", features = ["metal", "vulkan"] }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
