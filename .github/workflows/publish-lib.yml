name: Publish poincare-lib

on:
  push:
    tags:
      - "lib-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#lib-v}"
          CARGO_VERSION=$(grep '^version = ' crates/poincare-lib/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          test "$TAG_VERSION" = "$CARGO_VERSION"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libfontconfig1-dev

      - run: cargo publish -p poincare-lib --dry-run
      - run: cargo publish -p poincare-lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Get changelog entry
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#lib-v}"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          awk "/^## \[${TAG_VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" crates/poincare-lib/CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
