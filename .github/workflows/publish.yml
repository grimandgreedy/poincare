name: Publish Poincare

on:
  push:
    tags:
      - "app-v*"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
      lib_version: ${{ steps.versions.outputs.lib_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          APP_VERSION=$(grep '^version = ' crates/poincare-app/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          LIB_VERSION=$(grep '^version = ' crates/poincare-lib/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          test "$TAG_VERSION" = "$APP_VERSION"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lib_version=${LIB_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check changelog entries
        run: |
          APP_VERSION="${{ steps.versions.outputs.app_version }}"
          LIB_VERSION="${{ steps.versions.outputs.lib_version }}"
          awk "/^## \[${APP_VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" crates/poincare-app/CHANGELOG.md | grep -q '[^[:space:]]'
          awk "/^## \[${LIB_VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" crates/poincare-lib/CHANGELOG.md | grep -q '[^[:space:]]'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libxkbcommon-dev

      - name: Test workspace
        run: cargo test --workspace

      - name: Dry-run library publish
        run: cargo publish -p poincare-lib --dry-run

      - name: Preflight packaged app against local library
        run: |
          APP_VERSION="${{ steps.versions.outputs.app_version }}"
          cargo package -p poincare-app --no-verify \
            --config "patch.crates-io.poincare-lib.path=\"${GITHUB_WORKSPACE}/crates/poincare-lib\""
          tar -xzf "target/package/poincare-app-${APP_VERSION}.crate" -C target/package
          cargo check \
            --manifest-path "target/package/poincare-app-${APP_VERSION}/Cargo.toml" \
            --config "patch.crates-io.poincare-lib.path=\"${GITHUB_WORKSPACE}/crates/poincare-lib\""

  build-macos:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            artifact: poincare-macos-x86_64.zip
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: poincare-macos-aarch64.zip
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build app
        run: cargo build -p poincare-app --release --target ${{ matrix.target }}

      - name: Bundle app
        run: scripts/macos_bundle_app.sh release ${{ matrix.target }}

      - name: Archive app
        run: |
          cd target/${{ matrix.target }}/release
          ditto -c -k --sequesterRsrc --keepParent Poincare.app ../../../${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-linux:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libxkbcommon-dev

      - name: Build app
        run: cargo build -p poincare-app --release --target x86_64-unknown-linux-gnu

      - name: Bundle app
        run: scripts/linux_bundle_app.sh release x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: poincare-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/poincare-*-linux-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  build-windows:
    needs: preflight
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build app
        run: cargo build -p poincare-app --release

      - name: Bundle app
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/poincare-app/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $bundle = "poincare-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item target/release/poincare.exe "$bundle/poincare.exe"
          @"
          Poincare $version

          Run with:
            poincare.exe
          "@ | Set-Content "$bundle/README.txt"
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: poincare-windows-x86_64
          path: poincare-*-windows-x86_64.zip
          if-no-files-found: error

  publish:
    needs:
      - preflight
      - build-macos
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libxkbcommon-dev

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish library if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          LIB_VERSION: ${{ needs.preflight.outputs.lib_version }}
        run: |
          if curl --fail --silent "https://crates.io/api/v1/crates/poincare-lib/${LIB_VERSION}" >/dev/null; then
            echo "poincare-lib ${LIB_VERSION} is already published; skipping."
          else
            cargo publish -p poincare-lib
          fi

      - name: Wait for library in crates.io index
        env:
          LIB_VERSION: ${{ needs.preflight.outputs.lib_version }}
        run: |
          for attempt in {1..60}; do
            if cargo search poincare-lib --limit 5 | grep -q "^poincare-lib = \"${LIB_VERSION}\""; then
              exit 0
            fi
            echo "Waiting for poincare-lib ${LIB_VERSION} to appear in crates.io index (${attempt}/60)"
            sleep 10
          done
          echo "poincare-lib ${LIB_VERSION} did not appear in crates.io index" >&2
          exit 1

      - name: Publish app if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: |
          if curl --fail --silent "https://crates.io/api/v1/crates/poincare-app/${APP_VERSION}" >/dev/null; then
            echo "poincare-app ${APP_VERSION} is already published; skipping."
          else
            cargo publish -p poincare-app --dry-run
            cargo publish -p poincare-app
          fi

      - name: Get changelog entry
        id: changelog
        run: |
          APP_VERSION="${{ needs.preflight.outputs.app_version }}"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          awk "/^## \[${APP_VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" crates/poincare-app/CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: release-artifacts/*
