[package]
name = "poincare-lib"
version = "0.7.0"
edition = "2024"
description = "GPU-accelerated 3D plotting library for mathematical functions and scientific visualisation"
license = "MIT"
repository = "https://github.com/grimandgreedy/poincare"
homepage = "https://github.com/grimandgreedy/poincare"
documentation = "https://docs.rs/poincare-lib"
readme = "README.md"
keywords = ["math", "visualization", "visualisation", "3d", "wgpu"]
categories = ["graphics", "mathematics", "rendering", "science"]

[dependencies]
viewport-lib = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
serde = { version = "1", features = ["derive"] }
