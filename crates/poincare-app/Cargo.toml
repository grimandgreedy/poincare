[package]
name = "poincare-app"
version = "0.6.0"
edition = "2024"
description = "Interactive 3D mathematical graphing application"
license = "MIT"
repository = "https://github.com/grimandgreedy/poincare"
homepage = "https://github.com/grimandgreedy/poincare"
documentation = "https://docs.rs/poincare-app"
readme = "../../README.md"
keywords = ["math", "visualization", "visualisation", "3d", "egui"]
categories = ["graphics", "mathematics", "rendering", "science", "gui"]

[[bin]]
name = "poincare"
path = "src/main.rs"

[dependencies]
poincare-lib = { version = "0.5.0", path = "../poincare-lib" }
viewport-lib = { workspace = true }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11"] }
egui = { version = "=0.33.3" }
grimdock = { path = "../../../grimdock" }
glam = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
