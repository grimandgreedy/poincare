[package]
name = "poincare-app"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "poincare"
path = "src/main.rs"

[dependencies]
poincare-lib = { workspace = true }
viewport-lib = { workspace = true }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = { version = "=0.33.3" }
grimdock = "0.1.0"
glam = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
