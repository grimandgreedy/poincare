[package]
name = "poincare-evaluator"
version = "0.1.0"
edition = "2024"
description = "Backend-neutral evaluator API for Poincare notebooks"
license = "MIT"
repository = "https://github.com/grimandgreedy/poincare"
homepage = "https://github.com/grimandgreedy/poincare"
documentation = "https://docs.rs/poincare-evaluator"
keywords = ["math", "notebook", "evaluator"]
categories = ["mathematics", "science"]

[dependencies]
poincare-lib = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = "1"
