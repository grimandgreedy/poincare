[package]
name = "poincare-notebook-lib"
version = "0.1.0"
edition = "2024"
description = "Document model and bundle schema for Poincare notebooks"
license = "MIT"
repository = "https://github.com/grimandgreedy/poincare"
homepage = "https://github.com/grimandgreedy/poincare"
documentation = "https://docs.rs/poincare-notebook-lib"
keywords = ["math", "notebook", "visualization", "visualisation"]
categories = ["mathematics", "science"]

[dependencies]
poincare-lib = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = "1"
